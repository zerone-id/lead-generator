[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lead-generator"
version = "0.1.0"
description = "Phase 1 scaffold for lead generation pipeline review"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Phase 1 Team" }
]
dependencies = []

[project.scripts]
lead-generator = "lead_generator.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
